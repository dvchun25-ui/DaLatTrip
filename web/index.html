<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DaLatTrip - Lên Đà Lạt dễ hơn">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dalattrip">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DaLatTrip</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #cde0d5;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      box-sizing: border-box;
      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, .10) 0%,
          rgba(255, 255, 255, .02) 28%,
          rgba(0, 0, 0, 0) 52%,
          rgba(0, 0, 0, .08) 78%,
          rgba(0, 0, 0, .46) 100%
        ),
        url("assets/assets/images/dalat_splash_bg.jpg") center / cover no-repeat,
        #cde0d5;
      transition: opacity 220ms ease;
    }

    #app-splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-brand {
      position: absolute;
      top: clamp(42px, 8vh, 84px);
      left: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(360px, 82vw);
      transform: translateX(-50%);
      color: #173c31;
      font: 600 12.5px/1.35 Arial, sans-serif;
      letter-spacing: .15px;
      text-align: center;
      text-shadow: 0 1px 8px rgba(255, 255, 255, .8);
    }

    .splash-brand img {
      width: min(270px, 66vw);
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .14));
    }

    .splash-tagline {
      margin-top: 8px;
    }

    .splash-bottom {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: max(22px, env(safe-area-inset-bottom));
      color: #fffaf0;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .9);
    }

    .splash-title {
      font-size: clamp(31px, 7vw, 38px);
      font-weight: 600;
      line-height: 1.05;
    }

    .splash-subtitle {
      margin-top: 4px;
      color: #fff5da;
      font-size: clamp(23px, 5.5vw, 29px);
      font-weight: 500;
      line-height: 1.12;
    }

    .splash-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 30px;
    }

    .splash-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .46);
    }

    .splash-dot.active {
      width: 18px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-label="DaLatTrip đang khởi động">
    <div class="splash-brand">
      <img src="assets/assets/images/dalat_logo.png" alt="DaLatTrip">
      <div class="splash-tagline">Khám phá Đà Lạt theo cách của bạn</div>
    </div>
    <div class="splash-bottom">
      <div class="splash-title">Đi Đà Lạt</div>
      <div class="splash-subtitle">Dễ hơn bao giờ hết</div>
      <div class="splash-dots" aria-hidden="true">
        <span class="splash-dot active"></span>
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('app-splash');
      if (!splash) return;
      splash.classList.add('hide');
      window.setTimeout(function () { splash.remove(); }, 240);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
